<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFSCRIPT VIP - DASHBOARD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #05030a;
            --card-bg: rgba(15, 10, 22, 0.88);
            --primary-purple: #8b5cf6;
            --accent-red: #ef4444;
            --border-purple: #3b1d60;
            --border-red: rgba(239, 68, 68, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green-glow: #10b981;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; user-select: none; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; }

        #loginGate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #05030a; z-index: 90000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: rgba(12, 8, 20, 0.95); border: 1px solid var(--border-purple); border-top: 2px solid var(--accent-red); border-radius: 20px; padding: 30px 25px; width: 90%; max-width: 380px; text-align: center; }
        .sec-title { color: var(--accent-red); font-weight: bold; font-size: 18px; margin-bottom: 25px; }
        .circle-loader { width: 60px; height: 60px; border: 3px solid rgba(239, 68, 68, 0.1); border-top: 3px solid var(--accent-red); border-radius: 50%; margin: 0 auto 20px auto; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .progress-bar-bg { width: 100%; height: 6px; background: rgba(255,255,255,0.08); border-radius: 10px; overflow: hidden; margin-top: 15px; }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--accent-red); transition: width 0.1s linear; }

        .input-box { position: relative; margin-bottom: 18px; text-align: left; }
        .input-box label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .input-box i.input-icon { position: absolute; right: 14px; top: 37px; color: var(--text-muted); font-size: 14px; }
        select, input, textarea { width: 100%; padding: 12px 14px; background: #05030a; border: 1px solid var(--border-purple); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 350px; }
        .toast { background: rgba(15, 10, 25, 0.95); border: 1px solid var(--border-purple); padding: 12px 18px; border-radius: 12px; color: #fff; font-size: 13px; display: flex; align-items: center; gap: 12px; }

        .top-navbar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(10, 6, 18, 0.85); border-bottom: 1px solid var(--border-purple); position: sticky; top: 0; z-index: 100; }
        .brand-title { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; color: #fff; cursor: pointer; }
        .brand-icon { background: linear-gradient(135deg, var(--accent-red), var(--primary-purple)); width: 38px; height: 38px; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        .balance-badge { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        .sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: #080511; border-left: 1px solid var(--border-purple); z-index: 1000; transition: 0.35s; padding: 20px; }
        .sidebar.active { right: 0; }
        .sidebar-item { padding: 12px 15px; border-radius: 10px; margin-bottom: 10px; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 14px; }
        .sidebar-item.active { background: linear-gradient(135deg, var(--accent-red), var(--primary-purple)); color: #fff; }

        .container { width: 100%; max-width: 460px; padding: 20px 15px; }
        .card { background: var(--card-bg); border: 1px solid var(--border-purple); border-radius: 18px; padding: 22px; margin-bottom: 20px; position: relative; }
        .card-header-title { text-align: center; font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 20px; }

        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-red), var(--primary-purple)); border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 12px; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: #080511; border: 1px solid var(--border-purple); border-radius: 16px; padding: 22px; width: 100%; max-width: 400px; }
    </style>
</head>
<body>

<div id="loginGate">
    <div class="auth-card" id="secStep">
        <div class="sec-title">SECURITY VALIDATION</div>
        <div class="circle-loader"></div>
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="secProgress"></div></div>
    </div>
    <div class="auth-card" id="loginStep" style="display: none;">
        <div style="font-size: 20px; font-weight: bold; color: #fff; margin-bottom: 25px;">KEY DASHBOARD</div>
        <div class="input-box"><label>Username</label><input type="text" id="loginUsername"><i class="fa-solid fa-user input-icon"></i></div>
        <div class="input-box"><label>Password</label><input type="password" id="loginPassword"><i class="fa-solid fa-lock input-icon"></i></div>
        <button class="submit-btn" onclick="handleLogin()">Sign In <i class="fa-solid fa-arrow-right"></i></button>
    </div>
</div>

<div id="toast-container"></div>

<div class="top-navbar">
    <div class="brand-title" onclick="handleBrandClick()">
        <div class="brand-icon"><i class="fa-solid fa-crown" style="color: #fff;"></i></div>
        <span id="navUsername">GUEST USER</span>
    </div>
    <div class="nav-right">
        <div class="balance-badge"><i class="fa-solid fa-wallet"></i> $<span id="userBalance">0.00</span></div>
    </div>
</div>

<div class="container">
    <div class="card">
        <div class="card-header-title"><i class="fa-solid fa-bolt" style="color: var(--accent-red);"></i> Key Generator</div>
        <div class="form-group"><label>Product:</label><select id="productSelect"><option value="Drip Proxy Android">Drip Proxy Android</option></select></div>
        <div class="form-group" style="margin-top:10px;"><label>Duration:</label><select id="durationSelect"><option value="1 Days">1 Days - $1.20</option></select></div>
        <button class="submit-btn" onclick="sendOrder()"><i class="fa-solid fa-bolt"></i> Generate Keys Now</button>
    </div>

    <!-- SECRET ADMIN PANEL (PROTECTED) -->
    <div id="adminPanel" class="card" style="display: none; border-color: var(--accent-red);">
        <div class="card-header-title" style="color: var(--accent-red);"><i class="fa-solid fa-user-shield"></i> Secret Admin Panel</div>
        <p style="color: var(--green-glow); text-align: center;">Authorized Admin Session Active</p>
    </div>
</div>

<!-- Admin Password Modal -->
<div class="modal" id="adminPassModal">
    <div class="modal-content">
        <h3 style="margin-bottom: 15px; text-align: center; color: var(--accent-red);"><i class="fa-solid fa-lock"></i> Secret Admin Access</h3>
        <div class="input-box"><label>Enter Admin Password:</label><input type="password" id="adminPasswordInput"></div>
        <button class="submit-btn" style="background: var(--accent-red);" onclick="verifyAdminPassword()">Authorize Entry</button>
    </div>
</div>

<script>
    // تم تحديث الرابط برابط Vercel الخاص بسيرفر المتجر
    const SERVER_URL = "https://ffscriptvip-store.vercel.app";

    let brandClickCount = 0;
    let loggedInUserId = null;

    function showToast(msg) {
        const c = document.getElementById('toast-container');
        const t = document.createElement('div');
        t.className = 'toast';
        t.innerHTML = `<span>${msg}</span>`;
        c.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }

    function startSecurityValidation() {
        let p = 0;
        const fill = document.getElementById("secProgress");
        const interval = setInterval(() => {
            p += 10;
            fill.style.width = p + "%";
            if (p >= 100) {
                clearInterval(interval);
                document.getElementById("secStep").style.display = "none";
                document.getElementById("loginStep").style.display = "block";
            }
        }, 40);
    }

    function handleBrandClick() {
        brandClickCount++;
        if (brandClickCount >= 5) {
            brandClickCount = 0;
            document.getElementById("adminPassModal").style.display = "flex";
        }
    }

    async function handleLogin() {
        const u = document.getElementById("loginUsername").value.trim();
        const p = document.getElementById("loginPassword").value.trim();
        if(u && p) {
            loggedInUserId = u;
            document.getElementById("loginGate").style.display = "none";
            document.getElementById("navUsername").textContent = u;
            showToast("Logged in successfully");
        }
    }

    async function verifyAdminPassword() {
        const pass = document.getElementById("adminPasswordInput").value;
        try {
            const res = await fetch(`${SERVER_URL}/api/admin-login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                document.getElementById("adminPassModal").style.display = "none";
                document.getElementById("adminPanel").style.display = "block";
                showToast("Admin Verified via Server!");
            } else {
                showToast("Invalid Password!");
            }
        } catch(e) {
            showToast("Server connection error");
        }
    }

    async function sendOrder() {
        showToast("Processing request safely via Server...");
    }

    document.addEventListener("DOMContentLoaded", startSecurityValidation);
</script>
</body>
</html>
