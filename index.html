<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة حظ مسابقات AIM HACK</title>
    <style>
        body {
            background-color: #0f1016;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        canvas {
            border: 5px solid #222;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            transition: transform 4s cubic-bezier(0.15, 0.7, 0.1, 1);
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #ff3333; /* عدلنا اتجاه السهم وبقي مظبوط وعدل 100% */
            z-index: 10;
        }
        button {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 280px;
        }
    </style>
</head>
<body>

    <h1>عجلة الحظ الكبرى</h1>
    <div class="subtitle">جرب حظك الآن واحصل على أقوى جوائز AIM HACK!</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">اضغط لتدوير العجلة</button>
    <div id="result"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        // تقسيم العجلة لـ 10 أجزاء لتوزيع النسبة بدقة (10% و 20%)
        const prizes = [
            { text: "KEY 1 HOUR HACK", color: "#ffcc00", type: "grand" },     // 10% (شريحة واحدة)
            { text: "خصم شهر بـ 350ج", color: "#225588", type: "discount" },   // 20% (شريحتين)
            { text: "خصم شهر بـ 350ج", color: "#225588", type: "discount" },
            { text: "حاول بعد 4 ساعات", color: "#333333", type: "try_again" }, // 70% الباقية مقسمة على محاولات
            { text: "حاول بعد 5 ساعات", color: "#444444", type: "try_again" },
            { text: "حاول بعد 4 ساعات", color: "#333333", type: "try_again" },
            { text: "حاول بعد 5 ساعات", color: "#444444", type: "try_again" },
            { text: "حاول بعد 4 ساعات", color: "#333333", type: "try_again" },
            { text: "حاول بعد 5 ساعات", color: "#444444", type: "try_again" },
            { text: "حاول بعد 4 ساعات", color: "#333333", type: "try_again" }
        ];

        const arcs = prizes.length;
        const anglePerSegment = (2 * Math.PI) / arcs;
        let currentAngle = 0;

        function drawWheel() {
            ctx.clearRect(0, 0, 300, 300);
            for (let i = 0; i < arcs; i++) {
                const angle = i * anglePerSegment;
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + anglePerSegment);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.save();

                // كتابة النص داخل الأجزاء بشكل منظم
                ctx.translate(150, 150);
                ctx.rotate(angle + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 10px Tahoma";
                ctx.fillText(prizes[i].text, 130, 4);
                ctx.restore();
            }
        }

        drawWheel();

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("result.innerText") = "";
            let resultDiv = document.getElementById("result");
            resultDiv.innerText = "جاري تدوير العجلة...";
            resultDiv.style.backgroundColor = "transparent";

            // تحديد فائز عشوائي مسبقاً بناءً على نسب الحظ المطلوبة
            const winningIndex = getRandomIndexBasedOnProbability();
            
            // حساب الزوايا عشان السهم يوقف في منتصف الشريحة تماماً
            const degreesPerSegment = 360 / arcs;
            // السهم فوق (عند زاوية 270 درجة أو 0)، نظبط الحسابات بدقة
            const targetAngleFromTop = 360 - (winningIndex * degreesPerSegment + degreesPerSegment / 2);
            
            const extraSpins = 360 * 5; // 5 لفات كاملة للتشويق
            currentAngle = extraSpins + targetAngleFromTop;

            canvas.style.transform = `rotate(${currentAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const wonPrize = prizes[winningIndex].text;

                resultDiv.innerText = "مبروك! لقد ربحت:\n" + wonPrize;
                
                if(prizes[winningIndex].type === "grand") {
                    resultDiv.style.backgroundColor = "#554400";
                    resultDiv.style.color = "#ffcc00";
                } else if(prizes[winningIndex].type === "discount") {
                    resultDiv.style.backgroundColor = "#113355";
                    resultDiv.style.color = "#66ccff";
                } else {
                    resultDiv.style.backgroundColor = "#222222";
                    resultDiv.style.color = "#aaaaaa";
                }
            }, 4000);
        }

        // دالة توزيع نسب الحظ (10% للأولى، 20% للتانية، والباقي للمحاولات)
        function getRandomIndexBasedOnProbability() {
            const rand = Math.random() * 100;
            if (rand < 10) {
                return 0; // الجائزة الكبرى (10%)
            } else if (rand < 30) {
                return Math.random() < 0.5 ? 1 : 2; // الجائزة الثانية (20%)
            } else {
                return Math.floor(Math.random() * 7) + 3; // باقي المقاعد للمحاولات الأخرى (70%)
            }
        }
    </script>
</body>
</html>
