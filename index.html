<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFSCRIPTVIP STORE</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --accent-green: #22c55e;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            direction: rtl;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: #111827;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .shop-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .user-welcome {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .balance-card {
            background: var(--card-bg);
            padding: 12px 18px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .balance-title {
            font-size: 13px;
            color: var(--text-muted);
        }

        .balance-amount {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-green);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        .menu-btn {
            background: var(--btn-bg);
            color: #ffffff;
            border: none;
            padding: 12px 10px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .menu-btn.full-width {
            grid-column: span 2;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            font-size: 15px;
            padding: 14px;
        }

        .section-header {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .product-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
        }

        .product-status {
            font-size: 11px;
            color: var(--accent-green);
        }

        .buy-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="avatar">🛒</div>
        <div class="shop-title">FFSCRIPTVIP STORE</div>
        <div class="user-welcome">مرحباً بك! التسليم فوري وآلي 24/7</div>
        <div class="balance-card">
            <span class="balance-title">💳 الرصيد الحالي:</span>
            <span class="balance-amount" id="userBalance">$0.00</span>
        </div>
    </div>

    <div class="menu-grid">
        <button class="menu-btn full-width" onclick="scrollToCatalog()">🛍️ تصفح المتجر (Shop Now)</button>
        <button class="menu-btn" onclick="addBalance()">💰 شحن رصيد</button>
        <button class="menu-btn" onclick="showAlert('طلباتي', 'لا توجد طلبات سابقة.')">📦 طلباتي</button>
        <button class="menu-btn" onclick="showAlert('حسابي', 'معرف المستخدم: #849201')">👤 حسابي</button>
        <button class="menu-btn" onclick="showAlert('الدعم', 'تواصل مع الدعم الفني عبر تليجرام')">📞 الدعم الفني</button>
    </div>

    <div class="section-header" id="catalogSection">
        📦 قائمة المنتجات المتاحة
    </div>

    <div class="product-list">
        <div class="product-card" onclick="buyItem('BrMod Root Android', 15)">
            <div class="product-info">
                <span>🛒</span>
                <div>
                    <div class="product-name">BrMod Root Android</div>
                    <div class="product-status">● متوفر تلقائياً</div>
                </div>
            </div>
            <button class="buy-btn">$15.00</button>
        </div>

        <div class="product-card" onclick="buyItem('Drip Client ApkMod', 12)">
            <div class="product-info">
                <span>🛒</span>
                <div>
                    <div class="product-name">Drip Client ApkMod</div>
                    <div class="product-status">● متوفر تلقائياً</div>
                </div>
            </div>
            <button class="buy-btn">$12.00</button>
        </div>

        <div class="product-card" onclick="buyItem('ESign Certificate iOS', 25)">
            <div class="product-info">
                <span>🛒</span>
                <div>
                    <div class="product-name">ESign Certificate iOS</div>
                    <div class="product-status">● متوفر تلقائياً</div>
                </div>
            </div>
            <button class="buy-btn">$25.00</button>
        </div>

        <div class="product-card" onclick="buyItem('SilentCheats ApkMod', 10)">
            <div class="product-info">
                <span>🛒</span>
                <div>
                    <div class="product-name">SilentCheats ApkMod</div>
                    <div class="product-status">● متوفر تلقائياً</div>
                </div>
            </div>
            <button class="buy-btn">$10.00</button>
        </div>
    </div>
</div>

<script>
    let currentBalance = 0.00;

    function scrollToCatalog() {
        document.getElementById('catalogSection').scrollIntoView({ behavior: 'smooth' });
    }

    function addBalance() {
        const amount = prompt("أدخل المبلغ المراد إضافته للتجربة ($):", "50");
        if (amount && !isNaN(amount)) {
            currentBalance += parseFloat(amount);
            document.getElementById('userBalance').textContent = '$' + currentBalance.toFixed(2);
            alert("تم إضافة المبلغ لحسابك بنجاح!");
        }
    }

    function buyItem(name, price) {
        if (currentBalance >= price) {
            currentBalance -= price;
            document.getElementById('userBalance').textContent = '$' + currentBalance.toFixed(2);
            alert(`✅ تم شراء ${name} بنجاح!`);
        } else {
            alert("❌ رصيدك غير كافٍ. يرجى الشحن أولاً.");
        }
    }

    function showAlert(title, msg) {
        alert(`${title}:\n${msg}`);
    }
</script>

</body>
</html>
