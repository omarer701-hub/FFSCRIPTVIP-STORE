<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة حظ مسابقات AIM HACK</title>
    <style>
        body {
            background-color: #0f1016;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 20px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        canvas {
            border: 5px solid #222;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            width: 100%;
            height: 100%;
        }
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid #ff3333;
            z-index: 10;
        }
        button, .tg-btn {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        button:disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        .tg-btn {
            background: linear-gradient(45deg, #0088cc, #0055aa);
            color: #fff;
            display: none;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 280px;
        }
        #timer {
            color: #ff3333;
            font-size: 15px;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>عجلة الحظ الكبرى</h1>
    <div class="subtitle">جرب حظك الآن واحصل على أقوى جوائز AIM HACK!</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">اضغط لتدوير العجلة</button>
    <br>
    <a id="telegramBtn" class="tg-btn" href="#" target="_blank">📩 استلام الجائزة الكبرى عبر تليجرام</a>
    
    <div id="result"></div>
    <div id="timer"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        // حط هنا يوزر بوتك بتاع تليجرام من غير الـ @ (مثال: my_store_bot)
        const TELEGRAM_BOT_USERNAME = "FFSCRIPTVIP_distinct"; 

                const prizes = [
            { text: "KEY 1 HOUR", color: "#ffcc00", type: "grand" },     // الجائزة الكبرى
            { text: "خصم 350ج", color: "#225588", type: "discount" },  // خصم 1
            { text: "خصم 350ج", color: "#225588", type: "discount" },  // خصم 2
            { text: "حاول بعد 1س", color: "#222222", type: "try_1" },
            { text: "حاول بعد 2س", color: "#333333", type: "try_2" },
            { text: "حاول بعد 3س", color: "#444444", type: "try_3" },
            { text: "حاول بعد 4س", color: "#555555", type: "try_4" },
            { text: "حاول بعد 5س", color: "#666666", type: "try_5" },
            { text: "حاول بعد 2س", color: "#333333", type: "try_2" },
            { text: "حاول بعد 3س", color: "#444444", type: "try_3" }
        ];

    

        const arcs = prizes.length;
        const anglePerSegment = (2 * Math.PI) / arcs;
        let currentAngle = 0;

        function drawWheel(angle = 0) {
            ctx.clearRect(0, 0, 300, 300);
            ctx.save();
            ctx.translate(150, 150);
            ctx.rotate(angle);
            ctx.translate(-150, -150);

            for (let i = 0; i < arcs; i++) {
                const segAngle = i * anglePerSegment;
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, segAngle, segAngle + anglePerSegment);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.save();

                ctx.translate(150, 150);
                ctx.rotate(segAngle + anglePerSegment / 2);
                ctx.textAlign = "left";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px Tahoma";
                ctx.fillText(prizes[i].text, 40, 4);
                ctx.restore();
            }
            ctx.restore();
        }

        drawWheel();

        function checkCooldown() {
            const nextSpinTime = localStorage.getItem("nextSpinTime");
            if (nextSpinTime) {
                const now = new Date().getTime();
                const distance = nextSpinTime - now;

                if (distance > 0) {
                    document.getElementById("spinBtn").disabled = true;
                    startTimer(distance);
                } else {
                    localStorage.removeItem("nextSpinTime");
                }
            }
        }

        function startTimer(duration) {
            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const nextSpinTime = localStorage.getItem("nextSpinTime");
                const distance = nextSpinTime - now;

                if (distance < 0) {
                    clearInterval(timerInterval);
                    document.getElementById("spinBtn").disabled = false;
                    document.getElementById("timer").innerText = "";
                    localStorage.removeItem("nextSpinTime");
                } else {
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    document.getElementById("timer").innerText = `متبقي للمحاولة القادمة: ${hours}س ${minutes}د ${seconds}ث`;
                }
            }, 1000);
        }

        checkCooldown();

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("spinBtn").disabled = true;
            document.getElementById("telegramBtn").style.display = "none";
            
            let resultDiv = document.getElementById("result");
            resultDiv.innerText = "جاري تدوير العجلة...";
            resultDiv.style.backgroundColor = "transparent";

            const winningIndex = getRandomIndexBasedOnProbability();
            const degreesPerSegment = 360 / arcs;
            
            const targetAngle = 360 - (winningIndex * degreesPerSegment + degreesPerSegment / 2);
            const extraSpins = 360 * 6;
            const totalRotation = currentAngle + extraSpins + (targetAngle - (currentAngle % 360));
            
            let startTime = null;
            const duration = 4000;

            function animateSpin(currentTime) {
                if (!startTime) startTime = currentTime;
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOut = 1 - Math.pow(1 - progress, 3);
                const currentDeg = currentAngle + (totalRotation - currentAngle) * easeOut;
                
                drawWheel(currentDeg * (Math.PI / 180));

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    currentAngle = totalRotation % 360;
                    isSpinning = false;
                    const wonPrize = prizes[winningIndex].text;
                    const prizeType = prizes[winningIndex].type;

                    resultDiv.innerText = "مبروك! لقد ربحت:\n" + wonPrize;

                    let cooldownHours = 0;
                    if (prizeType === "try_4") cooldownHours = 4;
                    else if (prizeType === "try_5") cooldownHours = 5;

                    if (cooldownHours > 0) {
                        const nextTime = new Date().getTime() + (cooldownHours * 60 * 60 * 1000);
                        localStorage.setItem("nextSpinTime", nextTime);
                        startTimer(cooldownHours * 60 * 60 * 1000);
                    } else {
                        document.getElementById("spinBtn").disabled = false;
                    }

                    if(prizeType === "grand") {
                        resultDiv.style.backgroundColor = "#554400";
                        resultDiv.style.color = "#ffcc00";
                        // إظهار زر التليجرام الخاص بالجائزة الكبرى مع رسالة جاهزة للإرسال للبوت
                        const messageText = encodeURIComponent("🎉 لقد ربحت الجائزة الكبرى KEY 1 HOUR من عجلة الحظ، هذا هو طلبي لاستلام الكود!");
                        document.getElementById("telegramBtn").href = `https://t.me/${TELEGRAM_BOT_USERNAME}?start=${messageText}`;
                        document.getElementById("telegramBtn").style.display = "inline-block";
                    } else if(prizeType === "discount") {
                        resultDiv.style.backgroundColor = "#113355";
                        resultDiv.style.color = "#66ccff";
                    } else {
                        resultDiv.style.backgroundColor = "#222222";
                        resultDiv.style.color = "#aaaaaa";
                    }
                }
            }

            requestAnimationFrame(animateSpin);
        }

        function getRandomIndexBasedOnProbability() {
            const rand = Math.random() * 100;
            if (rand < 10) {
                return 0; // الكبرى 10%
            } else if (rand < 30) {
                return Math.random() < 0.5 ? 1 : 2; // التانية 20%
            } else {
                return Math.floor(Math.random() * 7) + 3; // الباقي محاولات
            }
        }
    </script>
</body>
</html>
