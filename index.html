<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFSCRIPTVIP STORE</title>
    <style>
        :root { --bg-color: #0d1117; --card-bg: #161b22; --accent-purple: #8a2be2; --accent-blue: #2f81f7; --accent-green: #238636; --border-color: #30363d; }
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg-color); color: #f0f6fc; padding: 15px; direction: rtl; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; background: #090d12; border-radius: 20px; padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 1px solid var(--border-color); }
        .header { text-align: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .user-id-badge { background: #21262d; padding: 5px 10px; border-radius: 8px; font-size: 12px; color: #8b949e; margin-top: 5px; display: inline-block; }
        .balance-box { background: rgba(35, 134, 54, 0.15); border: 1px solid var(--accent-green); border-radius: 12px; padding: 10px; text-align: center; margin-bottom: 15px; font-weight: bold; color: #3fb950; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #58a6ff; }
        select, input, textarea { width: 100%; padding: 12px; background-color: var(--card-bg); color: white; border: 1px solid var(--border-color); border-radius: 12px; }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #8b5cf6, #6366f1); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .admin-panel { display: none; background: #11161d; border: 1px solid var(--accent-purple); padding: 15px; border-radius: 15px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div style="font-size: 30px;">👑</div>
        <div style="font-size: 19px; font-weight: bold;">FFSCRIPTVIP STORE</div>
        <div class="user-id-badge">ID: <span id="myUserId">...</span></div>
    </div>

    <div class="balance-box">💰 الرصيد الحالي: $<span id="userBalance">0.00</span></div>
    
    <button style="width:100%; background:#238636; color:white; border:none; padding:10px; border-radius:10px; margin-bottom:15px;" onclick="openPaymentModal()">➕ شحن رصيد</button>

    <div class="form-group">
        <label>📦 المنتج:</label>
        <select id="productSelect"></select>
    </div>
    <div class="form-group">
        <label>⏳ المدة:</label>
        <select id="durationSelect"></select>
    </div>
    
    <button class="submit-btn" onclick="sendOrder()">🛒 تأكيد الطلب</button>
    <button style="margin-top:20px; width:100%; background:transparent; border:1px dashed #30363d; color:#8b949e; padding:10px; border-radius:10px;" onclick="openAdmin()">🔐 لوحة التحكم</button>

    <div class="admin-panel" id="adminPanel">
        <h3 style="color:#8a2be2;">إدارة الأدمن</h3>
        <div class="form-group">
            <label>ID المستخدم المستهدف:</label>
            <input type="text" id="adminTargetIdInput" placeholder="أدخل ID الزبون">
        </div>
        <div class="form-group">
            <label>المبلغ المراد إضافته ($):</label>
            <input type="number" id="adminAddBalanceInput" placeholder="0.00">
        </div>
        <button class="submit-btn" onclick="addBalanceAdmin()">💵 إضافة رصيد للمستخدم</button>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "mra359rt";
    
    // Initial Setup
    document.addEventListener("DOMContentLoaded", () => {
        // Generate/Load User ID
        let userId = localStorage.getItem("USER_ID");
        if (!userId) {
            userId = "USER_" + Math.floor(Math.random() * 1000000);
            localStorage.setItem("USER_ID", userId);
        }
        document.getElementById("myUserId").textContent = userId;
        
        // Load Balance for this specific ID
        let balance = localStorage.getItem("BALANCE_" + userId) || "0.00";
        document.getElementById("userBalance").textContent = balance;
    });

    function openAdmin() {
        // Check Lockout
        let lockUntil = localStorage.getItem("ADMIN_LOCK_UNTIL");
        if (lockUntil && Date.now() < parseInt(lockUntil)) {
            alert("❌ لقد تجاوزت عدد المحاولات. محظور لمدة 30 دقيقة.");
            return;
        }

        const pass = prompt("أدخل كلمة سر الأدمن:");
        if (pass === ADMIN_PASSWORD) {
            localStorage.setItem("ADMIN_FAIL_COUNT", 0);
            document.getElementById("adminPanel").style.display = "block";
            alert("✅ تم الدخول!");
        } else {
            let fails = parseInt(localStorage.getItem("ADMIN_FAIL_COUNT") || 0) + 1;
            localStorage.setItem("ADMIN_FAIL_COUNT", fails);
            
            if (fails >= 4) {
                localStorage.setItem("ADMIN_LOCK_UNTIL", Date.now() + (30 * 60 * 1000));
                alert("❌ 4 محاولات خاطئة! تم حظرك لمدة 30 دقيقة.");
            } else {
                alert(`❌ كلمة سر خاطئة! محاولات متبقية: ${4 - fails}`);
            }
        }
    }

    function addBalanceAdmin() {
        const targetId = document.getElementById("adminTargetIdInput").value.trim();
        const amount = parseFloat(document.getElementById("adminAddBalanceInput").value);
        
        if (!targetId || isNaN(amount)) { alert("يرجى إدخال ID صحيح ومبلغ صحيح"); return; }
        
        let currentBalance = parseFloat(localStorage.getItem("BALANCE_" + targetId) || "0.00");
        let newBalance = currentBalance + amount;
        
        localStorage.setItem("BALANCE_" + targetId, newBalance.toFixed(2));
        alert(`تم إضافة $${amount} للمستخدم ${targetId} بنجاح!`);
        location.reload(); // Refresh to update view if admin is modifying own ID
    }

    // Keep your other functions (sendOrder, etc) here...
</script>
</body>
</html>
