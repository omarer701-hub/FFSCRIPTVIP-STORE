<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة حظ مسابقات AIM HACK</title>
    <style>
        body {
            background-color: #0f1016;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffcc00;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        canvas {
            border: 5px solid #222;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 25px solid #ff3333;
            z-index: 10;
        }
        button {
            background: linear-gradient(45deg, #ffcc00, #ff9900);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.4);
        }
        button:active {
            transform: scale(0.95);
        }
        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
            min-width: 280px;
        }
    </style>
</head>
<body>

    <h1>عجلة الحظ الكبرى</h1>
    <div class="subtitle">جرب حظك الآن واحصل على أقوى جوائز AIM HACK!</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>

    <button id="spinBtn" onclick="spinWheel()">اضغط لتدوير العجلة</button>
    <div id="result"></div>

    <script>
        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");

        const prizes = [
            { text: "KEY 1 HOUR AIM HACK", color: "#ffcc00" }, // الجائزة الكبرى
            { text: "خصم شهر بـ 450ج (بدل 1200ج)", color: "#336699" }, // الجائزة التانية بلون مميز هادئ
            { text: "حاول مرة أخرى بعد 4 ساعات", color: "#444444" },
            { text: "محاولة جديدة بعد 5 ساعات", color: "#555555" },
            { text: "KEY 1 HOUR AIM HACK", color: "#ffaa00" },
            { text: "خصم شهر بـ 450ج (بدل 1200ج)", color: "#225588" }
        ];

        const arcs = prizes.length;
        const anglePerSegment = (2 * Math.PI) / arcs;
        let currentAngle = 0;

        function drawWheel() {
            for (let i = 0; i < arcs; i++) {
                const angle = i * anglePerSegment;
                ctx.beginPath();
                ctx.fillStyle = prizes[i].color;
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 150, angle, angle + anglePerSegment);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.save();

                // كتابة النص جوه العجلة
                ctx.translate(150, 150);
                ctx.rotate(angle + anglePerSegment / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px Tahoma";
                ctx.fillText(prizes[i].text.substring(0, 16), 130, 5);
                ctx.restore();
            }
        }

        drawWheel();

        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById("result").innerText = "جاري تدوير العجلة...";
            document.getElementById("result").style.backgroundColor = "transparent";

            // تحديد زاوية عشوائية لللف
            const randomSpin = Math.floor(Math.random() * 3600) + 1800;
            currentAngle += randomSpin;

            canvas.style.transform = `rotate(${currentAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                // حساب الجائزة اللي وقع عليها السهم
                const normalizedAngle = (360 - (currentAngle % 360)) % 360;
                const winningIndex = Math.floor(normalizedAngle / (360 / arcs));
                const wonPrize = prizes[winningIndex].text;

                const resultDiv = document.getElementById("result");
                resultDiv.innerText = "مبروك! لقد ربحت: \n" + wonPrize;
                
                if(wonPrize.includes("KEY")) {
                    resultDiv.style.backgroundColor = "#554400";
                    resultDiv.style.color = "#ffcc00";
                } else if(wonPrize.includes("خصم")) {
                    resultDiv.style.backgroundColor = "#113355";
                    resultDiv.style.color = "#66ccff";
                } else {
                    resultDiv.style.backgroundColor = "#333333";
                    resultDiv.style.color = "#aaaaaa";
                }
            }, 4000);
        }
    </script>
</body>
</html>
